<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title"><title id="title">Three steps: plan medication schedules, record intakes, review history</title><rect x="0" y="0" width="1200" height="405" rx="20" fill="#f2f7fa"/><text x="46" y="60" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#182e43">From a plan to a record</text><text x="46" y="93" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52677b">A conceptual walkthrough of the implemented features</text><rect x="46" y="127" width="342" height="210" rx="20" fill="#ffffff"/><text x="71" y="169" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#218d80">01</text><text x="71" y="211" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#182e43">Plan</text><text x="71" y="253" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677b">Medication + dose</text><text x="71" y="283" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677b">Times and repeat rules</text><rect x="429" y="127" width="342" height="210" rx="20" fill="#ffffff"/><text x="454" y="169" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#218d80">02</text><text x="454" y="211" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#182e43">Record</text><text x="454" y="253" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677b">Android reminders</text><text x="454" y="283" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677b">Mark a dose as taken</text><rect x="812" y="127" width="342" height="210" rx="20" fill="#ffffff"/><text x="837" y="169" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#218d80">03</text><text x="837" y="211" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#182e43">Review</text><text x="837" y="253" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677b">Search intake history</text><text x="837" y="283" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#52677b">Export CSV or PDF</text><text x="46" y="378" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#52677b">Illustration only. Reminder delivery and synchronization have known limitations; see README.</text></svg>