<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="965" viewBox="0 0 1200 965" role="img" aria-labelledby="title"><title id="title">מסדי נתונים מקומיים וסנכרון אופציונלי: משיכה, מיזוג, דחיפה ומגבלות הצפנה ושלמות</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087c70"/></marker></defs><rect x="0" y="0" width="1200" height="965" rx="22" fill="#f1f7f8"/><rect x="32" y="30" width="1136" height="128" rx="22" fill="#153548"/><text x="1120" y="72" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#7ddcc7">03  /  נתונים, סנכרון ופרטיות</text><text x="1120" y="115" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#fff">קודם במכשיר. ענן רק כשמגדירים.</text><text x="1120" y="190" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">המטרה: לעבוד מקומית ולשתף רשומות בין האפליקציה לדפדפן.</text><rect x="814" y="226" width="342" height="172" rx="22" fill="#fff"/><text x="1128" y="274" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#173447">אפליקציית אנדרואיד</text><text x="1128" y="313" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">מסד מקומי ותור שינויים</text><text x="1128" y="357" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#087c70">השינוי נשמר מקומית תחילה</text><rect x="44" y="226" width="342" height="172" rx="22" fill="#fff"/><text x="358" y="274" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#173447">אתר בדפדפן</text><text x="358" y="313" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">מסד מקומי ותור שינויים</text><text x="358" y="357" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#087c70">השינוי נשמר מקומית תחילה</text><rect x="435" y="226" width="330" height="172" rx="22" fill="#153548"/><text x="737" y="274" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#fff">סנכרון ענן אופציונלי</text><text x="737" y="315" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#d5e8ee">אימות גישה ורשומות מוצפנות</text><text x="737" y="357" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#7ddcc7">קוד מהאפליקציה מחבר את האתר</text><path d="M805 295 L778 295" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M778 333 L805 333" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M423 295 L397 295" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M397 333 L423 333" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1120" y="448" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#173447">מחזור הסנכרון באתר</text><rect x="814" y="477" width="342" height="134" rx="22" fill="#ddf2ec"/><text x="1124" y="514" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087c70">1 · משיכה</text><text x="1124" y="562" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#173447">קבלת הרשומות מהענן</text><rect x="429" y="477" width="342" height="134" rx="22" fill="#ddf2ec"/><text x="739" y="514" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087c70">2 · מיזוג</text><text x="739" y="562" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#173447">הכרעה לפי זמני עדכון</text><rect x="44" y="477" width="342" height="134" rx="22" fill="#ddf2ec"/><text x="354" y="514" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#087c70">3 · דחיפה</text><text x="354" y="562" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#173447">שליחת שינויים מקומיים</text><path d="M804 544 L785 544" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M419 544 L400 544" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="649" width="535" height="263" rx="22" fill="#fff"/><rect x="607" y="649" width="549" height="263" rx="22" fill="#fff0cf"/><text x="1124" y="692" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#173447">מה הצפנה לא מבטיחה?</text><text x="1124" y="738" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#173447">קוד הסנכרון נשלח גם לשרת</text><text x="1124" y="775" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#173447">ומשמש להפקת מפתח ההצפנה.</text><text x="1124" y="812" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#173447">לכן אין כאן הבטחה מוכחת</text><text x="1124" y="849" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#173447">להצפנה מקצה לקצה מול השרת.</text><text x="547" y="692" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#173447">מה עוד צריך לדעת?</text><text x="547" y="738" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#486275">המשיכה מוגבלת לאלף רשומות.</text><text x="547" y="775" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#486275">הפרופיל האישי אינו מסונכרן.</text><text x="547" y="812" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#486275">שמירה מקומית אינה בהכרח מוצפנת.</text><text x="547" y="849" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#486275">מצב ״מסונכרן״ אינו הוכחת שלמות.</text></svg>