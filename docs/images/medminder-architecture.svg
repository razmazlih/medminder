<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title"><title id="title">Android Room and Web IndexedDB connect to optional Firebase synchronization</title><rect x="0" y="0" width="1200" height="520" rx="20" fill="#f2f7fa"/><text x="46" y="60" font-family="DejaVu Sans, sans-serif" font-size="31" font-weight="700" fill="#182e43">Local first. Connected when configured.</text><rect x="46" y="115" width="340" height="270" rx="20" fill="#fff"/><text x="70" y="164" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#182e43">Android app</text><text x="70" y="205" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52677b">Kotlin + Jetpack Compose</text><rect x="70" y="237" width="292" height="108" rx="20" fill="#e5f4f0"/><text x="91" y="280" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#182e43">Room database</text><text x="91" y="313" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52677b">Local records + outbox</text><rect x="814" y="115" width="340" height="270" rx="20" fill="#fff"/><text x="838" y="164" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" fill="#182e43">Web client</text><text x="838" y="205" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52677b">React + TypeScript</text><rect x="838" y="237" width="292" height="108" rx="20" fill="#e5f4f0"/><text x="859" y="280" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#182e43">IndexedDB / Dexie</text><text x="859" y="313" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52677b">Local records + outbox</text><rect x="430" y="165" width="340" height="180" rx="20" fill="#102d41"/><text x="454" y="206" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#fff">Optional Firebase sync</text><text x="454" y="247" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#c8e2ec">Auth + Functions + Firestore</text><text x="454" y="283" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#75d5c9">Encrypted record payloads</text><path d="M391 254 h34 m-8 -6 l8 6 -8 6 M391 275 h34 m-26 -6 l-8 6 8 6" fill="none" stroke="#218d80" stroke-width="3"/><path d="M775 254 h34 m-8 -6 l8 6 -8 6 M775 275 h34 m-26 -6 l-8 6 8 6" fill="none" stroke="#218d80" stroke-width="3"/><text x="46" y="435" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#52677b">Web access uses a sync code generated in the Android app.</text><text x="46" y="472" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#52677b">Conceptual architecture. Encryption is not a verified end-to-end security guarantee.</text></svg>