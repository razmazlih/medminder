<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img" aria-labelledby="title"><title id="title">תזכורות: תוכנית יוצרת אירועים, מתוזמנת באנדרואיד ותלויה בהרשאות ובחלון יצירת האירועים</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087c70"/></marker></defs><rect x="0" y="0" width="1200" height="795" rx="22" fill="#f1f7f8"/><rect x="32" y="30" width="1136" height="128" rx="22" fill="#153548"/><text x="1120" y="72" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#7ddcc7">02  /  תזכורות באנדרואיד</text><text x="1120" y="115" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#fff">איך תוכנית הופכת להתראה?</text><text x="1120" y="190" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">השלבים קיימים בקוד; מסירת ההתראה בפועל דורשת בדיקה במכשיר.</text><rect x="460" y="225" width="696" height="95" rx="22" fill="#fff"/><rect x="1080" y="249" width="48" height="44" rx="12" fill="#ddf2ec"/><text x="1112" y="279" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087c70">1</text><text x="1055" y="262" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#173447">תוכנית התרופה</text><text x="1055" y="298" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#486275">זמנים וכללי חזרה שהמשתמש הגדיר</text><path d="M806 326 L806 339" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="460" y="344" width="696" height="95" rx="22" fill="#fff"/><rect x="1080" y="368" width="48" height="44" rx="12" fill="#ddf2ec"/><text x="1112" y="398" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087c70">2</text><text x="1055" y="381" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#173447">יצירת אירועי נטילה</text><text x="1055" y="417" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#486275">אירועים נבנים לכמה ימים קדימה בפעולות מסוימות</text><path d="M806 445 L806 458" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="460" y="463" width="696" height="95" rx="22" fill="#fff"/><rect x="1080" y="487" width="48" height="44" rx="12" fill="#ddf2ec"/><text x="1112" y="517" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087c70">3</text><text x="1055" y="500" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#173447">תזמון במערכת ההפעלה</text><text x="1055" y="536" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#486275">מנגנון האזעקות של אנדרואיד מפעיל התראה</text><rect x="44" y="225" width="374" height="333" rx="22" fill="#153548"/><text x="388" y="269" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#fff">מה יכול להשפיע?</text><text x="388" y="324" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#d5e8ee">הרשאות התראות ואזעקות</text><text x="388" y="369" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#d5e8ee">הגבלות מערכת ההפעלה</text><text x="388" y="414" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#d5e8ee">התנהגות המכשיר ברקע</text><text x="388" y="459" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#d5e8ee">והאם נוצרו אירועים חדשים</text><rect x="44" y="593" width="1112" height="157" rx="22" fill="#fff0cf"/><text x="1120" y="634" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#173447">המגבלה החשובה: חלון תזמון קצר</text><text x="1120" y="674" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#173447">בחלק מהמסלולים נוצרים אירועים ליומיים או לשלושה ימים קדימה בלבד.</text><text x="1120" y="709" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#173447">מילוי אוטומטי רציף לא הוכח. אין להסתמך על האפליקציה כתזכורת היחידה.</text></svg>