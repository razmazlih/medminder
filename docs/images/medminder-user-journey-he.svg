<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title"><title id="title">מסלול שימוש: הגדרת תוכנית, תיעוד נטילות ובדיקת היסטוריה</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#087c70"/></marker></defs><rect x="0" y="0" width="1200" height="640" rx="22" fill="#f1f7f8"/><rect x="32" y="30" width="1136" height="128" rx="22" fill="#153548"/><text x="1120" y="72" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#7ddcc7">01  /  חוויית השימוש</text><text x="1120" y="115" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#fff">מתוכנית נטילה להיסטוריה ברורה</text><text x="1120" y="190" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">מה המשתמש עושה, ומה המערכת שומרת מאחורי הקלעים.</text><rect x="822" y="225" width="334" height="262" rx="22" fill="#fff"/><rect x="1072" y="246" width="58" height="42" rx="12" fill="#ddf2ec"/><text x="1110" y="275" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087c70">1</text><text x="1128" y="331" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#173447">מגדירים</text><text x="1128" y="379" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">שם, מינון וזמני נטילה</text><text x="1128" y="415" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">תאריכים וכללי חזרה</text><text x="1128" y="451" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">נוצרת תוכנית מקומית</text><rect x="433" y="225" width="334" height="262" rx="22" fill="#fff"/><rect x="683" y="246" width="58" height="42" rx="12" fill="#ddf2ec"/><text x="721" y="275" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087c70">2</text><text x="739" y="331" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#173447">מתעדים</text><text x="739" y="379" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">פותחים את רשימת הנטילות</text><text x="739" y="415" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">מסמנים מה נלקח בפועל</text><text x="739" y="451" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">נשמר אירוע עם זמן וסטטוס</text><rect x="44" y="225" width="334" height="262" rx="22" fill="#fff"/><rect x="294" y="246" width="58" height="42" rx="12" fill="#ddf2ec"/><text x="332" y="275" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#087c70">3</text><text x="350" y="331" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" fill="#173447">בודקים</text><text x="350" y="379" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">מחפשים בהיסטוריה</text><text x="350" y="415" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">מתקנים רישום בעת הצורך</text><text x="350" y="451" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#486275">מייצאים דוח לעיון</text><path d="M808 354 L783 354" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M419 354 L394 354" stroke="#087c70" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="44" y="517" width="1112" height="88" rx="22" fill="#ddf2ec"/><text x="1124" y="552" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#173447">הדוגמה מסבירה התנהגות קיימת בקוד, לא טיפול מומלץ.</text><text x="1124" y="584" direction="rtl" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#486275">איור הסבר בלבד: אין כאן צילום מסך, נתוני מטופל או הוראות רפואיות.</text></svg>