<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#64B5F6"/>
    </linearGradient>
    <linearGradient id="bgDeep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0D47A1" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #263238; }
      .label { font: 600 26px Arial, sans-serif; fill: #263238; }
      .sub { font: 400 21px Arial, sans-serif; fill: #607D8B; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#F6FAFD"/>
  <text x="90" y="95" class="title">MedMinder App Icon Sketches</text>

  <!-- 1 Shield Check -->
  <g transform="translate(90 150)" filter="url(#shadow)">
    <rect width="250" height="250" rx="62" fill="url(#bgBlue)"/>
    <circle cx="125" cy="125" r="86" fill="#FFFFFF" fill-opacity="0.15"/>
    <path d="M125 48L188 80V128C188 172 160 210 125 222C90 210 62 172 62 128V80L125 48Z" fill="#FFFFFF"/>
    <path d="M125 66L170 90V126C170 159 150 189 125 199C100 189 80 159 80 126V90L125 66Z" fill="#E3F2FD"/>
    <path d="M100 134L118 152L156 112" stroke="#1565C0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="95" y="450" class="label">1. Shield + Check</text>
  <text x="95" y="485" class="sub">Safe, reliable, health-first</text>

  <!-- 2 Capsule Clock -->
  <g transform="translate(390 150)" filter="url(#shadow)">
    <rect width="250" height="250" rx="62" fill="url(#bgBlue)"/>
    <rect x="48" y="86" width="154" height="78" rx="39" fill="#FFFFFF"/>
    <path d="M125 86C157 86 183 112 183 125C183 138 157 164 125 164C93 164 67 138 67 125C67 112 93 86 125 86Z" fill="#E3F2FD"/>
    <path d="M125 86C157 86 183 112 183 125C183 138 157 164 125 164V86Z" fill="#64B5F6"/>
    <circle cx="125" cy="125" r="42" fill="#FFFFFF"/>
    <path d="M125 102V126L141 138" stroke="#1565C0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="125" cy="125" r="46" stroke="#1565C0" stroke-width="8"/>
  </g>
  <text x="395" y="450" class="label">2. Capsule + Clock</text>
  <text x="395" y="485" class="sub">Medication reminders at a glance</text>

  <!-- 3 Heart Cross -->
  <g transform="translate(690 150)" filter="url(#shadow)">
    <rect width="250" height="250" rx="62" fill="url(#bgDeep)"/>
    <path d="M125 201C73 166 48 136 48 98C48 66 71 44 101 44C119 44 135 52 145 66C155 52 171 44 189 44C219 44 242 66 242 98C242 136 217 166 165 201L145 214L125 201Z" fill="#FFFFFF"/>
    <rect x="176" y="72" width="46" height="46" rx="16" fill="#4CAF50"/>
    <path d="M199 82V108M186 95H212" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="695" y="450" class="label">3. Heart + Cross</text>
  <text x="695" y="485" class="sub">Caring, human, approachable</text>

  <!-- 4 Pill Organizer -->
  <g transform="translate(990 150)" filter="url(#shadow)">
    <rect width="250" height="250" rx="62" fill="url(#bgBlue)"/>
    <rect x="54" y="62" width="142" height="126" rx="28" fill="#FFFFFF"/>
    <path d="M54 105H196" stroke="#CFD8DC" stroke-width="8"/>
    <path d="M101 62V188M149 62V188" stroke="#CFD8DC" stroke-width="8"/>
    <rect x="68" y="76" width="20" height="20" rx="6" fill="#64B5F6"/>
    <rect x="116" y="76" width="20" height="20" rx="6" fill="#4CAF50"/>
    <rect x="164" y="76" width="20" height="20" rx="6" fill="#1565C0"/>
    <rect x="90" y="136" width="70" height="26" rx="13" fill="#E3F2FD"/>
    <path d="M90 149H160" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="995" y="450" class="label">4. Pill Organizer</text>
  <text x="995" y="485" class="sub">Daily structure and medication tracking</text>

  <!-- 5 Bell Pill -->
  <g transform="translate(1290 150)" filter="url(#shadow)">
    <rect width="250" height="250" rx="62" fill="url(#bgDeep)"/>
    <path d="M125 58C88 58 64 86 64 122V141C64 154 58 167 48 177L38 187C34 191 37 198 43 198H207C213 198 216 191 212 187L202 177C192 167 186 154 186 141V122C186 86 162 58 125 58Z" fill="#FFFFFF"/>
    <path d="M102 203C107 219 117 226 125 226C133 226 143 219 148 203" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <rect x="100" y="108" width="50" height="34" rx="17" fill="#64B5F6"/>
    <path d="M125 108C139 108 150 119 150 125C150 131 139 142 125 142C111 142 100 131 100 125C100 119 111 108 125 108Z" fill="#E3F2FD"/>
    <path d="M125 108C139 108 150 119 150 125C150 131 139 142 125 142V108Z" fill="#1565C0"/>
  </g>
  <text x="1295" y="450" class="label">5. Bell + Pill</text>
  <text x="1295" y="485" class="sub">Reminder-first, fast and practical</text>

  <!-- Footer hint -->
  <text x="90" y="610" class="label">Recommendation</text>
  <text x="90" y="645" class="sub">Best clarity: 2. Capsule + Clock | Most trustworthy: 1. Shield + Check | Warmest look: 3. Heart + Cross</text>
</svg>
