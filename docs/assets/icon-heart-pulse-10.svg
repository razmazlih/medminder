  <g transform="translate(770 610)" filter="url(#shadow)">
    <rect width="280" height="280" rx="72" fill="url(#bg2)"/>
    <circle cx="140" cy="140" r="94" fill="#FFFFFF" fill-opacity="0.16"/>
    <path d="M140 213C100 181 77 155 77 123C77 95 97 75 123 75C139 75 152 81 160 93C168 81 181 75 197 75C223 75 243 95 243 123C243 155 220 181 180 213L160 225L140 213Z" fill="#FFFFFF"/>
    <path d="M88 146H111L126 129L141 164L157 139L172 146H193" stroke="#D73E67" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
