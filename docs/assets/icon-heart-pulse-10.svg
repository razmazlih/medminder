  <!-- 10 -->
  <g transform="translate(1450 610)" filter="url(#shadow)">
    <rect width="280" height="280" rx="72" fill="url(#bg1)"/>
    <path d="M140 214C98 181 73 154 73 121C73 93 94 72 120 72C136 72 149 79 158 91C167 79 180 72 196 72C222 72 243 93 243 121C243 154 218 181 176 214L158 225L140 214Z" fill="#FFFFFF"/>
    <path d="M93 146H113L128 124L146 170L164 136L181 146H205" stroke="#1357D7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="140" cy="145" r="58" stroke="#D6E8FF" stroke-width="6"/>
