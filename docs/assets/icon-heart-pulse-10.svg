    <path d="M140 215C95 180 69 152 69 118C69 89 90 67 117 67C133 67 147 74 157 86C166 74 180 67 196 67C223 67 244 89 244 118C244 152 218 180 173 215L157 225L140 215Z" fill="#FFFFFF"/>
