    <rect width="280" height="280" rx="72" fill="url(#bg3)"/>
    <path d="M140 220C95 184 68 155 68 118C68 88 90 66 117 66C133 66 147 73 157 85C166 73 180 66 196 66C223 66 245 88 245 118C245 155 218 184 173 220L157 231L140 220Z" fill="#FFFFFF"/>
    <path d="M86 147H108L125 130L142 166L158 139L174 147H196" stroke="#0B7C6B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
